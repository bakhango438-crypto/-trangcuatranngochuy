<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang của Trần Ngọc Huy</title>
  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

<style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
    background:linear-gradient(-45deg,#000000,#0f172a,#00d4ff,#0066ff);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;

    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

    .box{
      padding:40px;
      background:#1b1b1b;
      border-radius:20px;
      width:90%;
      max-width:500px;
      box-shadow:0 0 25px rgba(0,255,255,.3);
    }

    h1{
    font-family:'Poppins',sans-serif;
    font-size:48px;
    font-weight:bold;
    color:#ff3333;
    text-shadow:0 0 5px #ff3333;
    animation:glow 2s infinite alternate,
              float 3s ease-in-out infinite;
    margin-bottom:20px;
}

    p{
      margin:10px 0;
      line-height:1.6;
    }

    button{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#00d4ff;
      color:black;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

<div class="box">
    <h1>Trang của Trần Ngọc Huy</h1>

    <p>Xin chào 👋</p>

    <p>Chào mừng bạn đến với website cá nhân của bảnh.</p>

    <p> Sống Chất |  Đẹp Trai |  Sành Điệu</p>

    <button onclick="showImage()">
  Xin chào
</button>

<br><br>

<video id="messi"
       width="300"
       controls
       style="display:none;border-radius:15px;">
  <source src="v1c044g50000d8f28gnog65io15akj80.mp4" type="video/mp4">
</video>

<script>
function showImage() {
    const video = document.getElementById("messi");
    video.style.display = "block";
    video.play();
}
</script>
</div>

</body>
</html>
